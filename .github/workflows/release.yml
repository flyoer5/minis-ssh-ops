name: Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* tag to release
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Validate release tag and version
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must match vMAJOR.MINOR.PATCH (received: $RELEASE_TAG)"
            exit 1
          fi
          TAG_VERSION="${RELEASE_TAG#v}"
          PUB_VERSION="$(awk '/^version:/ {print $2; exit}' app/pubspec.yaml | cut -d+ -f1)"
          if [[ -z "$PUB_VERSION" || "$TAG_VERSION" != "$PUB_VERSION" ]]; then
            echo "::error::Tag version $TAG_VERSION does not match pubspec version $PUB_VERSION"
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$PUB_VERSION" >> "$GITHUB_OUTPUT"

      - name: Reject committed Android signing material
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)(key\.properties|[^/]+\.(jks|keystore))$'; then
            echo "::error::Android signing material must be stored in GitHub Actions secrets"
            exit 1
          fi

      - name: Check release signing secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          missing=()
          [[ -z "$ANDROID_KEYSTORE_BASE64" ]] && missing+=(ANDROID_KEYSTORE_BASE64)
          [[ -z "$ANDROID_STORE_PASSWORD" ]] && missing+=(ANDROID_STORE_PASSWORD)
          [[ -z "$ANDROID_KEY_PASSWORD" ]] && missing+=(ANDROID_KEY_PASSWORD)
          [[ -z "$ANDROID_KEY_ALIAS" ]] && missing+=(ANDROID_KEY_ALIAS)
          if ((${#missing[@]} > 0)); then
            echo "::error::Missing Android release signing secrets: ${missing[*]}"
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.0"
          cache: false

      - name: Build Go backend for Android arm64
        run: |
          chmod +x scripts/build-go-android.sh
          ./scripts/build-go-android.sh
          test -s app/android/app/src/main/jniLibs/arm64-v8a/libssh_ai_agent.so

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      - name: Resolve Flutter dependencies
        working-directory: app
        run: flutter pub get --enforce-lockfile

      - name: Flutter checks
        working-directory: app
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test

      - name: Prepare release signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          umask 077
          mkdir -p app/android/keystore
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/android/keystore/release.jks
          test -s app/android/keystore/release.jks
          printf '%s\n' \
            "storePassword=$ANDROID_STORE_PASSWORD" \
            "keyPassword=$ANDROID_KEY_PASSWORD" \
            "keyAlias=$ANDROID_KEY_ALIAS" \
            "storeFile=keystore/release.jks" > app/android/key.properties

      - name: Build signed release APK (arm64)
        working-directory: app
        run: >-
          flutter build apk
          --release
          --target-platform android-arm64
          --split-per-abi
          --obfuscate
          --split-debug-info=build/debug-info

      - name: Verify release APK packaging
        shell: bash
        run: |
          chmod +x scripts/verify-apk-packaging.sh
          ./scripts/verify-apk-packaging.sh \
            app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            "$RUNNER_TEMP/release-apk-contents.md" \
            62914560

      - name: Package release assets
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          APK=app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          test -s "$APK"
          cp "$APK" "dist/ssh-ai-agent-${RELEASE_VERSION}-release.apk"
          cp "$APK" dist/ssh-ai-agent-latest-release.apk
          cp "$RUNNER_TEMP/release-apk-contents.md" dist/release-apk-contents.md
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-release-${{ steps.version.outputs.version }}
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt
            dist/release-apk-contents.md
          if-no-files-found: error

      - name: Upload release debug symbols
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-release-debug-symbols-${{ steps.version.outputs.version }}
          path: app/build/debug-info/
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            dist/ssh-ai-agent-*-release.apk \
            dist/SHA256SUMS.txt \
            --title "$RELEASE_TAG" \
            --generate-notes

      - name: Remove signing material
        if: always()
        shell: bash
        run: |
          rm -f app/android/key.properties app/android/keystore/release.jks
          rmdir app/android/keystore 2>/dev/null || true
